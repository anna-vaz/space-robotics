# ros2_control controllers, run by the controller manager INSIDE Gazebo's
# physics loop (gz_ros2_control), so they are synchronous with the 1 kHz physics.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    joint_state_broadcaster:        # publishes /joint_states
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_controller:              # raw torques from /effort_controller/commands
      type: effort_controllers/JointGroupEffortController

    joint_trajectory_controller:    # step 2: PD tracking of a quintic path
      type: joint_trajectory_controller/JointTrajectoryController

effort_controller:
  ros__parameters:
    joints: [joint1, joint2]

# tau = Kp (q_des - q) + Kd (qd_des - qd)  -- same law and gains as Project 1
# (ff_velocity_scale 0, no integral); between two waypoints at rest the
# controller's quintic spline is exactly P1's 10x^3 - 15x^4 + 6x^5 profile.
joint_trajectory_controller:
  ros__parameters:
    joints: [joint1, joint2]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    interpolation_method: splines
    gains:
      joint1: {p: 40.0, i: 0.0, d: 30.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
      joint2: {p: 20.0, i: 0.0, d: 10.0, i_clamp: 0.0, ff_velocity_scale: 0.0}
    constraints:
      goal_time: 0.0                  # 0 = no goal-time check
      stopped_velocity_tolerance: 0.0
