# Controllers for the 3-link (Project 1b) arm. Run inside Gazebo's 1 kHz loop.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true

    joint_state_broadcaster:        # publishes /joint_states
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:            # joint rates from /velocity_controller/commands
      type: velocity_controllers/JointGroupVelocityController

    effort_controller:              # raw torques from /effort_controller/commands
      type: effort_controllers/JointGroupEffortController

velocity_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3]

effort_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3]
